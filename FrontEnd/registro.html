<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro &amp; Cadastro</title>
    <link rel="stylesheet" href="./registro.css">
    <style>
        #mensagem {
            display: block;
            margin: 10px 0;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <form id="form-cadastro">
            <h1>Registrar</h1>
            <div class="box">
                <input name="nome" type="text" placeholder="Usuário" required>
                <ion-icon name="person"></ion-icon>
            </div>
            <div class="box">
                <input name="email" type="email" placeholder="E-mail" required>
                <ion-icon name="mail"></ion-icon>
            </div>
            <div class="box">
                <input name="senha" type="password" placeholder="Senha" required>
                <ion-icon name="lock-closed"></ion-icon>
            </div>
            <div class="relembrar">
                <label><input type="checkbox" required>Aceito os termos</label>
            </div>
            <div>
                <label name="mensagem"></label>
            </div>
            <button type="submit" class="btn">Cadastrar</button>
            <div class="registro">
                <p>Já tem uma conta? <a href="login.html">Acessar</a></p>
            </div>
        </form>
    </div>
    <script type="module" src="https://unpkg.com"></script>
    <script nomodule src="https://unpkg.com"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('form-cadastro');
            const mensagem = document.getElementById('mensagem');
            form.addEventListener('submit', (event) => {
                event.preventDefault(); 
                const nome = document.getElementById('nome').value;
                const email = document.getElementById('email').value;
                const senha = document.getElementById('senha').value;
                const usuario = { nome, email, senha };
                localStorage.setItem('usuarioCadastrado', JSON.stringify(usuario));
                mensagem.style.color = '#28a745';
                mensagem.textContent = 'Cadastro realizado com sucesso!';
                form.reset();
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            });
        });
    </script>
</body>

</html>
