<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro &amp; Cadastro</title>
    <link rel="stylesheet" href="./registro.css">
</head>

<body>
    <div class="wrapper">
        <div>
            <h1>Registrar</h1>
            <div class="box">
                <input id="nome" type="text" placeholder="Usuário" required>
                <ion-icon name="person"></ion-icon>
            </div>
            <div class="box">
                <input id="email" type="email" placeholder="E-mail" required>
                <ion-icon name="mail"></ion-icon>
            </div>
            <div class="box">
                <input id="senha" type="password" placeholder="Senha" required>
                <ion-icon name="lock-closed"></ion-icon>
            </div>
            <div class="relembrar">
                <label><input type="checkbox" required>Aceito os termos</label>
            </div>
            <div>
                <label id="mensagem"></label>
            </div>
            <button id="cadastrar" type="submit" class="btn">Cadastrar</button>
            <div class="registro">
                <p>Já tem uma conta? <a href="login.html">Acessar</a></p>
            </div>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="registro.js"></script>
</body>

</html>
